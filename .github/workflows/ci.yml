name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node.js 20 · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run full tests
        if: runner.os != 'Windows'
        run: npm test
      - name: Run Windows-compatible tests
        if: runner.os == 'Windows'
        run: npm run test:windows
      - run: npm run build
      - run: npm run test:sites
